# config/arch.yaml

encoder:
  backbone: "convnext_tiny"     # future: "convnext_small" | "resnet50" | ...
  pretrained: true
  freeze_backbone: true
  out_channels: 64             # feat_dim

attention:
  num_heads: 4
  window_size: 7

refinement:
  enabled: false                 # false → skip IterativeRefinement entirely
  num_iters: 4
  hidden_dim: 64

decoder:
  hidden_dim: 48

camera_head:
  hidden_dim: 96