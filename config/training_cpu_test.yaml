checkpoint:
  mode: min
  monitor: val/loss
  resume: null
  save_dir: checkpoints/
  save_top_k: 3
dataset:
  root_dir: datasets/sampled_data
  mde_source: "zoedepth"   # "zoedepth" | "depthpro"
  max_scenes: 628
loader:
  batch_size: 2
  drop_last: true
  num_workers: 1
  pin_memory: false
logging:
  log_dir: runs/
  project: mono-depth-3DR
  run_name: null
  tensorboard: true
loss:
  depth: 1.0
  smooth: 0.05
  iter_supervision: 0.0
  camera: 0.3            # was 0.8 — too dominant, fighting depth learning
  camera_warmup_epochs: 20   # was 15 — you only have 20 epochs total
  pixel_consistency: 0.005  # was 0.01 — reduce geometric noise early
  identity: 0.05         # was 0.0 — re-enable round-trip regulariser
  K_reg: 0.3             # was 0.0 — intrinsics supervision helps anchor pose
  rot: 1.5               # was implicit 1.0 — boost rotation signal
  trans: 0.5             # was implicit 1.0 — down-weight translation (harder)
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.0002
  type: adamw
  weight_decay: 0.00001
scheduler:
  eta_min: 1.0e-05
  type: cosine
train:
  epochs: 50
  grad_clip: 1.0
  log_every: 50
  seed: 0
  val_every: 1
  patience: 8
  num_pose_iters: 1
  pose_warmup_epochs: 5
  loss_spike_threshold: 50.0
