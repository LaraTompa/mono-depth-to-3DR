checkpoint:
  mode: min
  monitor: val/abs_rel
  resume: null
  save_dir: checkpoints/
  save_top_k: 3
dataset:
  root_dir: datasets/sampled_data
  mde_source: "zoedepth"   # "zoedepth" | "depthpro"
  max_scenes: 300
loader:
  batch_size: 4
  drop_last: true
  num_workers: 2
  pin_memory: false
logging:
  log_dir: runs/
  project: mono-depth-3DR
  run_name: null
loss:
  depth: 1.0
  iter_supervision: 0.5
  smooth: 0.05
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.0001
  type: adamw
  weight_decay: 0.0001
scheduler:
  eta_min: 1.0e-06
  type: cosine
train:
  epochs: 10
  grad_clip: 1.0
  log_every: 50
  seed: 0
  val_every: 1
  patience: 5
