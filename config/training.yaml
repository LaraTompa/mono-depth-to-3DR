# ─────────────────────────────────────────────────────────────────────────────
# training.yaml  —  all training hyper-parameters and data configuration
# ─────────────────────────────────────────────────────────────────────────────

# ---------------------------------------------------------------------------
# Dataset / scene root
# ---------------------------------------------------------------------------
dataset:
  root_dir:   "datasets/sampled_data"
  mde_source: "zoedepth"   # "zoedepth" | "depthpro"

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
loader:
  batch_size: 4
  num_workers: 4
  pin_memory: true
  drop_last: true

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimizer:
  type:         adamw
  lr:           3.0e-4   # raised from 1e-4 — backbone is frozen so high LR is safe; pose head trains from scratch and needs stronger updates to escape local min
  weight_decay: 1.0e-3   # raised from 5e-4 — extra regularisation for pose head generalisation
  betas:        [0.9, 0.999]

# ---------------------------------------------------------------------------
# LR scheduler
# ---------------------------------------------------------------------------
scheduler:
  type:          cosine
  eta_min:       3.0e-5   # scaled proportionally with lr (same 10× decay ratio)

# ---------------------------------------------------------------------------
# Loss weights
# ---------------------------------------------------------------------------
loss:
  depth:            0.5    # scale-invariant log loss (supervised)
  smooth:           0.005   # edge-aware smoothness
  iter_supervision: 0.0    # deep supervision over refinement iterations
  camera:           0.5    # was 0.1 — pose needs stronger signal vs depth (1.0)
  camera_warmup_epochs: 5   # pose was learning faster after epoch 15 (confidence weighting); front-load it
  pixel_consistency: 0.0  # multiview reprojection consistency
  identity:         0.05   # pose round-trip regulariser weight — raised from 0.05 (5x more signal for anti-parallel constraint)
  K_reg: 0.0             # was 0.0 — intrinsics supervision helps anchor pose
  rot: 0.8               # was implicit 1.0 — boost rotation signal
  trans: 0.8             # raised from 0.5 — translation stalling; more supervision signal
  pose_warmup_epochs: 5     # disable confidence weighting for first N epochs; match camera_warmup_epochs
  # -- Geometric consistency (Lgc, ViSTA-SLAM) ----------------------------
  geometric:              0.1   # weight for Lgc; set 0 to disable
  geometric_warmup_epochs: 30   # start Lgc after this epoch
  geometric_switch_epochs: 50   # epoch to switch from GT → predicted pose for Lgc


# ---------------------------------------------------------------------------
# Data augmentation  (training split only; val/test are never augmented)
# Set any value to 0.0 to disable that transform.
# ---------------------------------------------------------------------------
augment: True
augmentation:
  # Geometric — applied to images, depths, mde_depths, poses, and intrinsics.
  # Both views of a pair are flipped together so the relative pose stays valid.
  #
  # WARNING: horizontal flip requires the cross-attention encoder to be
  # equivariant to reflections.  With freeze_cross_attn: true the frozen
  # DINOv2 + MASt3R features do NOT encode orientation changes, so flipped
  # images produce nearly identical embeddings while the GT relative pose
  # changes sign in R and tx.  This creates contradictory rotation training
  # signal → rotation stall.  Re-enable only when freeze_cross_attn: false.
  p_hflip:    0.0    # disabled while cross-attention is frozen

  # Photometric — applied to RGB images only, independently per view.
  # Factor is sampled uniformly from [1-x, 1+x] (brightness/contrast/saturation)
  # or [-x, x] (hue).
  brightness: 0.2
  contrast:   0.2
  saturation: 0.2
  hue:        0.05   # fraction of 0.5 (TF.adjust_hue convention)

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
train:
  epochs: 50
  grad_clip: 1.0                 # max gradient norm; null → disabled
  val_every: 1                   # validate every N epochs
  log_every: 50                  # log every N batches
  seed: 0
  loss_spike_threshold: 50.0     # skip batch if loss exceeds this value
  patience: 50
  num_pose_iters: 1             # number of pose-refinement iterations per batch
  gradient_accumulation_steps: 2 # accumulate grads over N batches (effective batch = batch_size * N)

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpoint:
  save_dir: "checkpoints/"
  save_top_k: 3                  # keep the best K checkpoints
  monitor: "val/loss"         # metric to track for best-model selection
  mode: "min"                    # "min" | "max"
  resume: null                   # path to .pt checkpoint to resume from

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  project: "mono-depth-3DR"
  run_name: null                 # null → auto-generated timestamp
  log_dir: "runs/"
  tensorboard: true              # write TensorBoard event files
