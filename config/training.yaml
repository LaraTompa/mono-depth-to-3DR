# ─────────────────────────────────────────────────────────────────────────────
# training.yaml  —  all training hyper-parameters and data configuration
# ─────────────────────────────────────────────────────────────────────────────

# ---------------------------------------------------------------------------
# Dataset / scene root
# ---------------------------------------------------------------------------
dataset:
  root_dir:   "datasets/sampled_data"
  mde_source: "zoedepth"   # "zoedepth" | "depthpro"

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  drop_last: true

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimizer:
  type:         adamw
  lr:           3.0e-5
  weight_decay: 1.0e-4
  betas:        [0.9, 0.999]

# ---------------------------------------------------------------------------
# LR scheduler
# ---------------------------------------------------------------------------
scheduler:
  type:          cosine
  eta_min:       1.0e-6

# ---------------------------------------------------------------------------
# Loss weights
# ---------------------------------------------------------------------------
loss:
  depth:            1.0    # scale-invariant log loss (supervised)
  smooth:           0.05   # edge-aware smoothness
  iter_supervision: 0.5    # deep supervision over refinement iterations
  camera:           0.1    # weight for combined camera-pose + intrinsics loss
  camera_warmup_epochs: 15 # ramp camera weight 0 → final over this many epochs
  pixel_consistency: 0.01  # multiview reprojection consistency
  identity:         0.05   # pose round-trip regulariser weight

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
train:
  epochs: 50
  grad_clip: 1.0                 # max gradient norm; null → disabled
  val_every: 1                   # validate every N epochs
  log_every: 50                  # log every N batches
  seed: 0
  pose_warmup_epochs: 10         # disable confidence weighting for first N epochs
  loss_spike_threshold: 50.0     # skip batch if loss exceeds this value

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpoint:
  save_dir: "checkpoints/"
  save_top_k: 3                  # keep the best K checkpoints
  monitor: "val/abs_rel"         # metric to track for best-model selection
  mode: "min"                    # "min" | "max"
  resume: null                   # path to .pt checkpoint to resume from

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  project: "mono-depth-3DR"
  run_name: null                 # null → auto-generated timestamp
  log_dir: "runs/"
  tensorboard: true              # write TensorBoard event files
