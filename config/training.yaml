# ─────────────────────────────────────────────────────────────────────────────
# training.yaml  —  all training hyper-parameters and data configuration
# ─────────────────────────────────────────────────────────────────────────────

# ---------------------------------------------------------------------------
# Dataset / scene root
# ---------------------------------------------------------------------------
dataset:
  root_dir:      "datasets/sampled_data"       # train + val scenes (80 / 20 split)
  test_root_dir: "datasets_test/sampled_data"  # held-out test scenes (separate root)
  mde_source: "zoedepth"   # "zoedepth" | "depthpro"
  image_size: [480, 640]   # (W, H) for MDE input and model output; see max_encode_hw in arch config

# ---------------------------------------------------------------------------
# Optional depth normalisation during training/evaluation
# ---------------------------------------------------------------------------
depth_normalization:
  enabled: false
  max_samples: 2000000  # valid pixels sampled from train split for median/std estimation
  mde:
    median: 1.0
    std: 1.0
    scale: 1.0
    offset: 0.0
  gt:
    median: 1.0
    std: 1.0
    scale: 1.0
    offset: 0.0

# ---------------------------------------------------------------------------
# Optional point-map scale normalisation (depth_only model only)
# ---------------------------------------------------------------------------
# When enabled, a single global scalar (median Euclidean norm of all valid 3D
# points in the training set, pooled over both views) is computed once before
# training starts and used to divide the XYZ point-map priors fed to the
# decoder.  Predicted and GT point maps are compared in these normalised units;
# pixel_consistency / geometric_consistency losses receive metric inputs via
# automatic de-normalisation.  Output point maps from the model are in
# normalised units — multiply by scale to recover metres.
#
# Constraints (same as depth_normalization):
#   - Single isotropic scalar, never per-axis.
#   - No mean subtraction — scale only.
#   - Default OFF; no effect on v1 / vista models.
#
# scale is populated automatically at runtime by compute_point_normalization_stats().
point_normalization:
  enabled: false
  max_samples: 2000000  # 3D point norms sampled from train split
  scale: 1.0            # filled in at runtime; do not set manually

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
loader:
  batch_size: 4
  num_workers: 4
  pin_memory: true
  drop_last: true

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimizer:
  type:         adamw
  lr:           1.0e-5
  weight_decay: 1.0e-4
  betas:        [0.9, 0.999]
  # Cross-attention block (MASt3R weights) gets a lower LR to fine-tune
  # conservatively.  Set to 1.0 to disable the per-group scaling.
  cross_attn_lr_scale: 0.1

# ---------------------------------------------------------------------------
# LR scheduler
# ---------------------------------------------------------------------------
scheduler:
  type:          cosine
  eta_min:       1.0e-5   # scaled proportionally with lr (same 10× decay ratio)

# ---------------------------------------------------------------------------
# Loss weights
# ---------------------------------------------------------------------------
loss:
  # ── depth_only (point-map) variant ───────────────────────────────────────
  # Primary supervised loss: L1 on XYZ point maps with confidence weighting.
  point_map:        1.0    # L1 XYZ point-map loss (depth_only only)

  # Auxiliary multiview losses — operate on the Z-channel of the point maps
  # as a depth proxy.  Both are warmup-gated so early training is anchored
  # purely by point_map supervision.
  pixel_consistency:              0.1   # multiview reprojection pixel error
  pixel_consistency_warmup_epochs: 5   # start after this many epochs

  geometric:              0.1   # ViSTA Lgc 3-D warp consistency
  geometric_warmup_epochs: 5    # start after this many epochs
  geometric_switch_epochs: 999  # never switch to predicted pose (no pose head)

  # Confidence weighting: disable for first N epochs so the residual head
  # stabilises before the network also optimises uncertainty.
  pose_warmup_epochs: 3

  # ── v1 / vista (scalar depth) variant — unused for depth_only ────────────
  depth:            0.1    # scale-invariant log loss
  depth_mse:        0.4    # mean-squared-error depth loss
  smooth:           0.0    # edge-aware smoothness
  iter_supervision: 0.0    # deep supervision over refinement iterations

  # ── Pose losses — only active when predict_pose: true ────────────────────
  camera:           0.0
  camera_warmup_epochs: 5
  identity:         0.0
  K_reg:            0.0
  rot:              0.5
  trans:            0.5


# ---------------------------------------------------------------------------
# Data augmentation  (training split only; val/test are never augmented)
# Set any value to 0.0 to disable that transform.
# ---------------------------------------------------------------------------
augment: False
augmentation:
  # Geometric — applied to images, depths, mde_depths, poses, and intrinsics.
  # Both views of a pair are flipped together so the relative pose stays valid.
  #
  # WARNING: horizontal flip requires the cross-attention encoder to be
  # equivariant to reflections.  With freeze_cross_attn: true the frozen
  # DINOv2 + MASt3R features do NOT encode orientation changes, so flipped
  # images produce nearly identical embeddings while the GT relative pose
  # changes sign in R and tx.  This creates contradictory rotation training
  # signal → rotation stall.  Re-enable only when freeze_cross_attn: false.
  p_hflip:    0.0    # disabled while cross-attention is frozen

  # Photometric — applied to RGB images only, independently per view.
  # Factor is sampled uniformly from [1-x, 1+x] (brightness/contrast/saturation)
  # or [-x, x] (hue).
  brightness: 0.2
  contrast:   0.2
  saturation: 0.2
  hue:        0.05   # fraction of 0.5 (TF.adjust_hue convention)

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
train:
  epochs: 60
  grad_clip: 1.0                 # max gradient norm; null → disabled
  val_every: 1                   # validate every N epochs
  log_every: 500                  # log every N batches
  seed: 0
  loss_spike_threshold: 50.0     # skip batch if loss exceeds this value
  patience: 50
  num_pose_iters: 1             # number of pose-refinement iterations per batch
  gradient_accumulation_steps: 2 # accumulate grads over N batches (effective batch = batch_size * N)

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpoint:
  save_dir: "checkpoints/"
  save_top_k: 3                  # keep the best K checkpoints
  monitor: "val/loss"         # metric to track for best-model selection
  mode: "min"                    # "min" | "max"
  resume: null                   # path to .pt checkpoint to resume from

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  project: "mono-depth-3DR"
  run_name: null                 # null → auto-generated timestamp
  log_dir: "runs/"
  tensorboard: true              # write TensorBoard event files
