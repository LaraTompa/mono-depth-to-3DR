# ─────────────────────────────────────────────────────────────────────────────
# training.yaml  —  all training hyper-parameters and data configuration
# ─────────────────────────────────────────────────────────────────────────────

# ---------------------------------------------------------------------------
# Dataset / scene root
# ---------------------------------------------------------------------------
dataset:
  root_dir: "datasets/sampled_data"
  # expected layout: root_dir/train/<scenes>  and  root_dir/val/<scenes>
  sampler_type: "temporal"       # "temporal" | "graph"
  num_frames: 6                  # frames per sequence
  num_samples: 700               # virtual epoch length (DataLoader __len__)
  min_stride: 40
  max_stride: 90
  max_scenes: null               # null → use all scenes; int → cap for debugging

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  drop_last: true

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  feat_dim:    128        # encoder output channels at each scale
  hidden_dim:  128        # ConvGRU hidden state channels
  num_iters:   4          # refinement iterations
  num_heads:   4          # local attention heads
  window_size: 7          # local attention window (pixels in feature space)
  pretrained:  true       # load ImageNet ConvNeXt-Tiny weights

  # Camera intrinsics fallback (used when dataset does not supply them per batch)
  fx: 577.0
  fy: 577.0
  cx: 320.0
  cy: 240.0

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
optimizer:
  type:         adamw
  lr:           1.0e-4
  weight_decay: 1.0e-4
  betas:        [0.9, 0.999]

# ---------------------------------------------------------------------------
# LR scheduler
# ---------------------------------------------------------------------------
scheduler:
  type:          cosine
  warmup_epochs: 5
  eta_min:       1.0e-6

# ---------------------------------------------------------------------------
# Loss weights
# ---------------------------------------------------------------------------
loss:
  depth:            1.0    # scale-invariant log loss (supervised)
  smooth:           0.05   # edge-aware smoothness
  iter_supervision: 0.5    # deep supervision over refinement iterations
  # photometric and consistency re-enable once depths are reasonable:
  # photometric:    0.1
  # consistency:    0.1

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
train:
  epochs: 50
  grad_clip: 1.0                 # max gradient norm; null → disabled
  mixed_precision: true          # torch.cuda.amp
  accumulate_grad_batches: 1     # gradient accumulation steps
  val_every: 1                   # validate every N epochs
  log_every: 50                  # log every N batches
  seed: 0

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpoint:
  save_dir: "checkpoints/"
  save_top_k: 3                  # keep the best K checkpoints
  monitor: "val/abs_rel"         # metric to track for best-model selection
  mode: "min"                    # "min" | "max"
  resume: null                   # path to .pt checkpoint to resume from

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  project: "mono-depth-3DR"
  run_name: null                 # null → auto-generated timestamp
  log_dir: "runs/"
